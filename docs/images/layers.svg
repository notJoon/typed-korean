<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 490" font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <defs>
    <marker id="up" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#999"/>
    </marker>
  </defs>
  <style>
    .hdr { font-size: 17px; fill: #888; }
    .box { stroke-width: 2.5; rx: 10; }
    .badge { font-size: 16px; font-weight: 700; fill: #fff; text-anchor: middle; dominant-baseline: central; }
    .dir { font-family: 'JetBrains Mono', D2Coding, Menlo, monospace; font-size: 19px; font-weight: 700; fill: #222; dominant-baseline: central; }
    .role { font-size: 19px; fill: #444; dominant-baseline: central; }
    .call { font-family: 'JetBrains Mono', D2Coding, Menlo, monospace; font-size: 15px; fill: #777; }
    .res { font-family: 'JetBrains Mono', D2Coding, Menlo, monospace; font-size: 19px; font-weight: 700; fill: #222; }
    .link { stroke: #ccc; stroke-width: 2; stroke-dasharray: 5 5; }
  </style>

  <text class="hdr" x="20" y="24">계층</text>
  <text class="hdr" x="700" y="24">예: 타입 호출 → 결과</text>

  <!-- Layer 4 -->
  <rect class="box" x="20" y="40" width="645" height="64" fill="#f3e8fd" stroke="#8e44c9"/>
  <rect x="34" y="56" width="74" height="32" rx="6" fill="#8e44c9"/>
  <text class="badge" x="71" y="72">Layer 4</text>
  <text class="dir" x="124" y="72">sentence/</text>
  <text class="role" x="380" y="72">문장 조립 · 의문문</text>
  <line class="link" x1="665" y1="72" x2="690" y2="72"/>
  <text class="call" x="700" y="64">Render&lt;Statement&lt;…&gt;&gt;</text>
  <text class="res" x="700" y="91">"나는 밥을 먹었다"</text>

  <line x1="330" y1="130" x2="330" y2="110" stroke="#999" stroke-width="2.5" marker-end="url(#up)"/>

  <!-- Layer 3 -->
  <rect class="box" x="20" y="132" width="645" height="64" fill="#fde8ef" stroke="#c9446d"/>
  <rect x="34" y="148" width="74" height="32" rx="6" fill="#c9446d"/>
  <text class="badge" x="71" y="164">Layer 3</text>
  <text class="dir" x="124" y="164">particles/ phrase/</text>
  <text class="role" x="380" y="164">조사 선택 · 구 조립</text>
  <line class="link" x1="665" y1="164" x2="690" y2="164"/>
  <text class="call" x="700" y="156">NounWithParticle&lt;Noun&lt;"밥"&gt;, "object"&gt;</text>
  <text class="res" x="700" y="183">"밥을"</text>

  <line x1="330" y1="222" x2="330" y2="202" stroke="#999" stroke-width="2.5" marker-end="url(#up)"/>

  <!-- Layer 2 -->
  <rect class="box" x="20" y="224" width="645" height="64" fill="#fdf0e2" stroke="#d9822b"/>
  <rect x="34" y="240" width="74" height="32" rx="6" fill="#d9822b"/>
  <text class="badge" x="71" y="256">Layer 2</text>
  <text class="dir" x="124" y="256">conjugation/</text>
  <text class="role" x="380" y="256">활용 엔진</text>
  <line class="link" x1="665" y1="256" x2="690" y2="256"/>
  <text class="call" x="700" y="248">Conjugate&lt;먹다, "과거_평서"&gt;</text>
  <text class="res" x="700" y="275">"먹었다"</text>

  <line x1="330" y1="314" x2="330" y2="294" stroke="#999" stroke-width="2.5" marker-end="url(#up)"/>

  <!-- Layer 1 -->
  <rect class="box" x="20" y="316" width="645" height="64" fill="#e3f5ec" stroke="#2f9e6b"/>
  <rect x="34" y="332" width="74" height="32" rx="6" fill="#2f9e6b"/>
  <text class="badge" x="71" y="348">Layer 1</text>
  <text class="dir" x="124" y="348">vocabulary/</text>
  <text class="role" x="380" y="348">어휘 정의 (동사·형용사·명사)</text>
  <line class="link" x1="665" y1="348" x2="690" y2="348"/>
  <text class="call" x="700" y="340">먹다</text>
  <text class="res" x="700" y="367">{ stem: "먹" }</text>

  <line x1="330" y1="406" x2="330" y2="386" stroke="#999" stroke-width="2.5" marker-end="url(#up)"/>

  <!-- Layer 0 -->
  <rect class="box" x="20" y="408" width="645" height="64" fill="#e6eefc" stroke="#3b6fd8"/>
  <rect x="34" y="424" width="74" height="32" rx="6" fill="#3b6fd8"/>
  <text class="badge" x="71" y="440">Layer 0</text>
  <text class="dir" x="124" y="440">hangul-unicode/</text>
  <text class="role" x="380" y="440">음절 분해·조합 (codegen 테이블)</text>
  <line class="link" x1="665" y1="440" x2="690" y2="440"/>
  <text class="call" x="700" y="432">HasBatchim&lt;"밥"&gt;</text>
  <text class="res" x="700" y="459">true</text>
</svg>
